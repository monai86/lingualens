<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">PasaScope Clinical Workflow</title>
  <desc id="desc">Four-stage decision-support flow: Intake, Transcript, Clinical Findings, Therapist-Signed Report.</desc>
  <rect width="960" height="320" rx="16" fill="#F7FAF8"/>
  <rect x="8" y="8" width="944" height="304" rx="12" fill="#FFFFFF" stroke="#DBE4E0" stroke-width="2"/>

  <!-- Connecting pipeline tracks -->
  <line x1="160" y1="150" x2="380" y2="150" stroke="#DBE4E0" stroke-width="4" stroke-linecap="round"/>
  <line x1="380" y1="150" x2="600" y2="150" stroke="#DBE4E0" stroke-width="4" stroke-linecap="round"/>
  <line x1="600" y1="150" x2="820" y2="150" stroke="#DBE4E0" stroke-width="4" stroke-linecap="round"/>

  <!-- Stage 1: Case Intake -->
  <g transform="translate(150, 150)">
    <circle r="46" fill="#EDF5F2" stroke="#265347" stroke-width="3.5"/>
    <!-- Folder / Case Icon -->
    <path d="M-16 -12 h12 l4 4 h16 v22 h-32 z" fill="none" stroke="#265347" stroke-width="3" stroke-linejoin="round"/>
    <text y="70" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#142520" text-anchor="middle">1. Case Intake</text>
    <text y="90" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#5A736B" text-anchor="middle">Consent &amp; Audio Input</text>
  </g>

  <!-- Stage 2: Audio & Transcript -->
  <g transform="translate(380, 150)">
    <circle r="46" fill="#EDF5F2" stroke="#265347" stroke-width="3.5"/>
    <!-- Waveform / Sound Icon -->
    <line x1="-16" y1="-8" x2="-16" y2="8" stroke="#265347" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-8" y1="-16" x2="-8" y2="16" stroke="#265347" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="-22" x2="0" y2="22" stroke="#265347" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="8" y1="-16" x2="8" y2="16" stroke="#265347" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="16" y1="-8" x2="16" y2="8" stroke="#265347" stroke-width="3.5" stroke-linecap="round"/>
    <text y="70" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#142520" text-anchor="middle">2. Transcript Review</text>
    <text y="90" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#5A736B" text-anchor="middle">ASR &amp; CHAT Alignment</text>
  </g>

  <!-- Stage 3: Clinical Findings -->
  <g transform="translate(600, 150)">
    <circle r="46" fill="#FEF1F3" stroke="#F45B69" stroke-width="3.5"/>
    <!-- Scope / Magnifier Icon -->
    <circle cx="-3" cy="-4" r="14" fill="none" stroke="#F45B69" stroke-width="3"/>
    <line x1="7" y1="6" x2="18" y2="17" stroke="#F45B69" stroke-width="3.5" stroke-linecap="round"/>
    <text y="70" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#142520" text-anchor="middle">3. Clinical Findings</text>
    <text y="90" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#5A736B" text-anchor="middle">Lexical &amp; LSA Indicators</text>
  </g>

  <!-- Stage 4: Signed Report -->
  <g transform="translate(810, 150)">
    <circle r="46" fill="#EDF5F2" stroke="#265347" stroke-width="3.5"/>
    <!-- Document Checkmark Icon -->
    <rect x="-14" y="-18" width="28" height="34" rx="4" fill="none" stroke="#265347" stroke-width="3"/>
    <path d="M-6 0 l4 4 l9 -9" fill="none" stroke="#265347" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text y="70" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#142520" text-anchor="middle">4. Signed Report</text>
    <text y="90" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#5A736B" text-anchor="middle">Therapist Attestation</text>
  </g>

  <!-- Clinical Safety Footnote Badge -->
  <g transform="translate(480, 280)">
    <rect x="-240" y="-14" width="480" height="28" rx="14" fill="#EDF5F2" stroke="#C9DDD5" stroke-width="1"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#265347" text-anchor="middle">
      🛡️ Decision-Support Prototype • Therapist Clinical Review Required Before Report Sign-Off
    </text>
  </g>
</svg>
